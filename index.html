<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend Mentor | Huddle simple landing page</title>
    <!-- Importation de la favicon -->
    <link
      rel="shortcut icon"
      href="img/favicon-32x32.png"
      type="image/x-icon"
    />
    <!-- CDN font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <!-- Importation des styles -->
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Début du header -->
    <div class="logo">
      <img src="img/logo.svg" alt="Logo Huddle" class="logo__huddle" />
    </div>
    <!-- Fin du header-->

    <!-- Début du main -->
    <main class="main__content">
      <!-- Début de la section container -->
      <section class="main__container">
        <article class="container__article--1">
          <div class="container__image">
            <img
              src="img/illustration-mockups.svg"
              alt="Illustration mockups"
            />
          </div>
        </article>
        <article class="container__article--2">
          <h1 class="container__article__title">
            Build the community <br />your fans will love
          </h1>
          <p class="container__article__text">
            Huddle re-imagines the way we build communities. You have a voice,
            but so does your audience. Create connections with your users as you
            engage in genuine discussion.
          </p>
          <button class="container__article__btn">Register</button>
        </article>
      </section>
      <!-- Fin de la section container -->
    </main>
    <!-- Fin du main -->

    <!-- Début du footer -->
    <footer>
      <ul class="footer__list">
        <li>
          <a href="#">
            <i class="fab fa-facebook-f"></i>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fab fa-twitter"></i>
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fab fa-instagram"></i>
          </a>
        </li>
      </ul>
    </footer>
    <!-- Fin du footer -->
  </body>
</html>
